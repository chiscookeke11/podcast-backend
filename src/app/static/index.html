<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Podcast Voice Studio</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; background: #0f172a; color: #e2e8f0; }
    .card { max-width: 920px; margin: 0 auto; background: #1e293b; border-radius: 12px; padding: 1.25rem; }
    textarea, input, select { width: 100%; margin-top: .35rem; margin-bottom: .9rem; padding: .55rem; border-radius: 6px; border: 1px solid #334155; background: #0b1220; color: #e2e8f0; }
    button { background: #22c55e; color: #052e16; border: 0; padding: .7rem 1rem; border-radius: 8px; font-weight: 700; cursor: pointer; }
    pre { background: #0b1220; padding: .75rem; border-radius: 8px; overflow: auto; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .muted { color: #94a3b8; font-size: .92rem; }
    audio { width: 100%; margin-top: .4rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Podcast Voice Studio</h1>
    <p class="muted">Create a two-host episode and play generated voice lines.</p>

    <label>API Base URL</label>
    <input id="api_base" value="http://127.0.0.1:8000" />

    <label>Episode title</label>
    <input id="title" value="Frontend Voice Test" />

    <label>Source text (min 100 chars)</label>
    <textarea id="source" rows="6">Artificial intelligence is changing how content is produced. Teams now prototype ideas in minutes, but quality still depends on clear structure, tone control, and human review. This sample text is long enough to trigger generation and helps test the voice pipeline end to end.</textarea>

    <label>Turns</label>
    <select id="turns"><option>6</option><option selected>8</option><option>10</option></select>

    <div class="grid">
      <div>
        <h3>Host A</h3>
        <input id="a_name" value="Nova" />
        <input id="a_voice" value="21m00Tcm4TlvDq8ikWAM" />
        <input id="a_world" value="Optimistic builder mindset." />
        <input id="a_style" value="Clear, upbeat, concise." />
        <input id="a_debate" value="Pushes practical solutions." />
      </div>
      <div>
        <h3>Host B</h3>
        <input id="b_name" value="Atlas" />
        <input id="b_voice" value="AZnzlk1XvdvUeBnXmlld" />
        <input id="b_world" value="Skeptical analyst mindset." />
        <input id="b_style" value="Measured, strategic, grounded." />
        <input id="b_debate" value="Challenges assumptions with data." />
      </div>
    </div>

    <button id="go">Generate Episode</button>
    <p id="status" class="muted"></p>
    <pre id="debug"></pre>
    <div id="players"></div>
  </div>

<script>
const $ = (id) => document.getElementById(id);

function host(prefix) {
  return {
    name: $(`${prefix}_name`).value,
    voice: {
      voice_id: $(`${prefix}_voice`).value,
      stability: 0.45,
      similarity_boost: 0.75,
      style_exaggeration: 0.40,
      speaking_rate: 1.0,
      model_id: "eleven_turbo_v2_5"
    },
    character: {
      worldview: $(`${prefix}_world`).value,
      speaking_style: $(`${prefix}_style`).value,
      debate_style: $(`${prefix}_debate`).value,
      forbidden: ""
    }
  };
}

function payload() {
  return {
    episode_title: $("title").value,
    source_text: $("source").value,
    num_turns: Number($("turns").value),
    host_a: host("a"),
    host_b: host("b")
  };
}

function apiBase() {
  return $("api_base").value.replace(/\/$/, "");
}

async function pollEpisode(id) {
  for (let i = 0; i < 120; i++) {
    const r = await fetch(`${apiBase()}/episodes/${id}`);
    const ep = await r.json();
    $("debug").textContent = JSON.stringify(ep, null, 2);
    $("status").textContent = `Status: ${ep.status}`;
    if (ep.status === "ready" || ep.status === "failed") return ep;
    await new Promise(res => setTimeout(res, 2000));
  }
  throw new Error("Timed out waiting for episode");
}

function renderPlayers(ep) {
  const el = $("players");
  el.innerHTML = "<h3>Voice Output</h3>";
  (ep.audio_files || []).forEach((url, idx) => {
    const row = document.createElement("div");
    row.innerHTML = `<div class='muted'>Line ${idx + 1}: ${url}</div><audio controls src='${url}'></audio>`;
    el.appendChild(row);
  });
}

$("go").addEventListener("click", async () => {
  try {
    $("status").textContent = "Submitting episode request...";
    $("players").innerHTML = "";
    const res = await fetch(`${apiBase()}/episodes/generate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload())
    });
    if (!res.ok) throw new Error(`Request failed: ${res.status}`);
    const pending = await res.json();
    $("status").textContent = `Queued: ${pending.id}. Polling...`;
    const ep = await pollEpisode(pending.id);
    if (ep.status === "ready") {
      $("status").textContent = "Episode ready ✅";
      renderPlayers(ep);
    } else {
      $("status").textContent = `Failed: ${ep.error || 'unknown error'}`;
    }
  } catch (e) {
    $("status").textContent = `Error: ${e.message}`;
  }
});
</script>
</body>
</html>
